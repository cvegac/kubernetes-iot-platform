apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mqtt-cloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision | quote }}
    path: workloads/mqtt-broker/overlays/cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: mqtt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
