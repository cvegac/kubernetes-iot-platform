# Un broker por cada gateway edge: cualquier cluster registrado en Argo CD con label tier=edge
# recibe su Application automáticamente. Sumar un edge = registrar el cluster, nada más.
# Las plantillas del ApplicationSet van escapadas ({{`{{.name}}`}}) para que Helm las deje pasar tal cual.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mqtt-edge
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: edge
  template:
    metadata:
      name: 'mqtt-{{`{{.name}}`}}'
    spec:
      project: default
      source:
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.revision | quote }}
        path: workloads/mqtt-broker/overlays/edge
      destination:
        server: '{{`{{.server}}`}}'
        namespace: mqtt
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
