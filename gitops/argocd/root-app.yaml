# App-of-apps: Argo CD renderiza el chart gitops/apps y crea desde ahí todas las demás Applications/ApplicationSets.
# bootstrap/up.sh reemplaza "main" por REVISION (la rama actual por defecto, el SHA del commit en CI).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cvegac/kubernetes-iot-platform.git
    targetRevision: main
    path: gitops/apps
    helm:
      valuesObject:
        revision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
