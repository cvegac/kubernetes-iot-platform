# App-of-apps: Argo CD lee gitops/apps y crea desde ahí todas las demás Applications/ApplicationSets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cvegac/kubernetes-iot-platform.git
    targetRevision: feat/multi-cluster # pasa a main al mergear
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
