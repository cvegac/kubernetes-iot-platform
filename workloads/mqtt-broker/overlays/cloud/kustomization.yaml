# Broker central: recibe lo que reenvían los gateways edge por el bridge.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mqtt
resources:
  - ../../base
patches:
  # NodePort para que los edge lleguen desde fuera del cluster. En producción: LoadBalancer + TLS.
  - target:
      kind: Service
      name: mqtt
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 31883
