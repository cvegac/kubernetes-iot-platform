listener 1883
allow_anonymous true
persistence false
log_dest stdout

# Bridge al broker central: lo que los dispositivos (ESP32) publican en sensors/# sale hacia el cloud con QoS 1.
# Si se corta el enlace, el broker local sigue atendiendo a los dispositivos y el bridge reintenta.
connection cloud
address iot-cloud-control-plane:31883
topic sensors/# out 1
restart_timeout 2 30
